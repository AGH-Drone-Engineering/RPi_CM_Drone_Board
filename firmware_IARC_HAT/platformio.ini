; PlatformIO Project Configuration File

[base_esp32s3]
platform = espressif32@^6.5.0
board = seeed_xiao_esp32s3
framework = arduino
; Generates $BUILD_DIR/version.h with the commit this image is built from.
; Inherited by all three envs through `extends` - unlike lib_deps and
; build_flags below, this option isn't re-declared per env, so it isn't
; clobbered.
extra_scripts = pre:scripts/git_version.py
lib_deps =
	jgromes/RadioLib@^7.4.0
monitor_speed = 115200
build_flags =
	-I lib/RFNet/src
	-std=gnu++17
	-D LOGGER_ENABLED=0
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:transmitter]
extends = base_esp32s3
build_src_filter =
	+<transmitter/>

[env:receiver]
extends = base_esp32s3
build_src_filter =
	+<receiver/>

[env:node]
extends = base_esp32s3
build_src_filter =
	+<node/>
	-<node/main_phone.cpp>
lib_deps =
	jgromes/RadioLib@^7.4.0
build_flags =
	-I lib/RFNet/src
	-std=gnu++17
	-D LOGGER_ENABLED=1
	-D ARDUINO_USB_CDC_ON_BOOT=1


[env:killswitch]
extends = base_esp32s3
build_src_filter =
	+<killswitch/>
lib_deps =
	jgromes/RadioLib@^7.4.0
build_flags =
	-I lib/RFNet/src
	-std=gnu++17
	-D LOGGER_ENABLED=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:phone]
extends = base_esp32s3
build_src_filter =
	+<node/>
	-<node/main_node.cpp>
lib_deps =
	jgromes/RadioLib@^7.4.0
build_flags =
	-I lib/RFNet/src
	-std=gnu++17
	-D LOGGER_ENABLED=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
